name: Publish to GitHub Pages

on:
  push:
    branches: ["claude/sweet-hypatia-loy8bl"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync branch to gh-pages
        run: git push --force origin HEAD:gh-pages
